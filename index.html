                    const elem = document.documentElement;
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(err => console.log(err));
                    } else if (elem.webkitRequestFullscreen) { /* Safari */
                        elem.webkitRequestFullscreen();
                    } else if (elem.msRequestFullscreen) { /* IE11 */
                        elem.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen && document.fullscreenElement) {
                        document.exitFullscreen().catch(err => console.log(err));
                    } else if (document.webkitExitFullscreen) { /* Safari */
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) { /* IE11 */
                        document.msExitFullscreen();
                    }

                        setUploadedImages(prev => ({

                    {

                    {

                            <div>

                                            </div>

                                    <p className="text-xl">All three of those installations have an approved, final building permit.</p>

                    {

                            <div>
                                <RenderImageOrFallback imageKey="slide_report" alt="Report Example" fallback={null} />

                            </div>

                    },
                    {
                        title: "We Fix It",
                        content: (
                            <div className="text-center">
                                <RenderImageOrFallback imageKey="slide_fixit" alt="We Fix It" fallback={null} />
                                <h3 className="text-3xl font-bold text-yellow-500 mb-4 mt-6">Dual Licensed Contractor</h3>
                                <div className="flex flex-col md:flex-row justify-center items-center gap-4 mb-4">
                                    <div className="bg-slate-800 px-6 py-2 rounded-full border border-yellow-500">
                                        <strong className="text-white">General B License</strong>
                                    </div>
                                    <div className="text-yellow-500 font-bold">+</div>
                                    <div className="bg-slate-800 px-6 py-2 rounded-full border border-yellow-500">
                                        <strong className="text-white">Solar C-46 License</strong>

                    },
                    {
                        title: "Annual Service",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="slide_service" alt="Annual Service" fallback={null} />
                                <div className="flex flex-col items-center mt-6">
                                    <div className="bg-yellow-500/10 p-4 rounded-lg border border-yellow-500 mb-4 max-w-2xl">
                                        <p className="text-lg font-bold text-yellow-500 mb-1">Why Hire Us for Cleaning?</p>
                                        <p className="text-white">Most solar cleaners are unlicensed. Because we hold <span className="text-yellow-500 font-bold">General B & C-46 Licenses</span>, we can identify and repair issues while we clean.</p>
                                    </div>
                                    <p className="text-xl">Cleaning and maintenance plans available to keep the warranty valid.</p>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Client Education",
                        content: (
                            <div className="text-left max-w-2xl mx-auto">
                                <RenderImageOrFallback imageKey="slide_questions" alt="Questions" fallback={null} />
                                <p className="mb-4 text-lg">Clients usually have no idea how their system works. We answer:</p>
                                <ul className="text-lg space-y-2 list-disc pl-8">
                                    <li>What is my expected annual savings?</li>
                                    <li>Who do I call to transfer ownership?</li>
                                    <li>Is my system under warranty?</li>
                                    <li>How do I monitor it (App login)?</li>
                                    <li>Who do I call for service?</li>
                                </ul>
                            </div>

                    },
                    {
                        title: "Let's Work Together",
                        content: (
                            <div className="text-center flex flex-col items-center">
                                <div className="w-full max-w-sm mb-4">

                                <p className="text-3xl font-bold text-white mb-6">Rocklin Solar Repair</p>
                                <div className="inline-block bg-yellow-500 text-slate-900 px-8 py-4 rounded-lg text-3xl font-bold shadow-lg mb-8 hover:scale-105 transition-transform">

                                </div>
                            </div>
                        )
                    }

                // =========================================================================
                // END OF LOCKED SECTION
                // =========================================================================
                tpo: [
                    {

                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="tpo_hero" alt="TPO Hero" fallback={null} />
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl mt-4">
                                    <div className="bg-slate-800 p-6 rounded">
                                        <h3 className="text-yellow-500 text-2xl font-bold mb-2">Lease</h3>
                                        <p>You pay a fixed "Rent" for the equipment on the roof. <br/>Ex: $150/month regardless of production.</p>
                                    </div>
                                    <div className="bg-slate-800 p-6 rounded">
                                        <h3 className="text-yellow-500 text-2xl font-bold mb-2">PPA</h3>
                                        <p>Power Purchase Agreement. You buy the power produced. <br/>Ex: $0.18/kWh.</p>
                                    </div>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "The Big 5",
                        subtitle: "Ignore the other 20 pages.",
                        content: (
                            <ul className="text-left text-xl space-y-4">

                                <li>1. <span className="text-yellow-500">Price:</span> Monthly or per kWh?</li>
                                <li>2. <span className="text-yellow-500">Escalator:</span> How much does it go up per year?</li>
                                <li>3. <span className="text-yellow-500">Transfer:</span> Can the buyer take it over?</li>
                                <li>4. <span className="text-yellow-500">Guarantee:</span> Is there a production guarantee?</li>
                                <li>5. <span className="text-yellow-500">Equipment:</span> Who fixes it when it breaks?</li>
                            </ul>
                        )
                    },
                    {
                        title: "The Silent Killer: Escalators",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="tpo_escalator_graph" alt="Escalator Graph" fallback={null} />

                                            <tr className="border-b border-slate-600">

                                                <th className="p-3">Year 20</th>

                                        </thead>
                                        <tbody>
                                            <tr className="bg-slate-800/50">
                                                <td className="p-3 font-bold">0% (Flat)</td>
                                                <td className="p-3">$150</td>
                                                <td className="p-3">$150</td>
                                                <td className="p-3">$150</td>
                                            </tr>
                                            <tr>
                                                <td className="p-3 font-bold">2.9%</td>

                                                <td className="p-3">$194</td>
                                                <td className="p-3">$258</td>
                                            </tr>
                                            <tr className="bg-slate-800/50">
                                                <td className="p-3 font-bold text-red-400">3.5%</td>
                                                <td className="p-3">$150</td>
                                                <td className="p-3">$205</td>
                                                <td className="p-3">$290</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Case Study: Rates",
                        content: (
                            <div className="w-full max-w-3xl border border-slate-700 rounded overflow-hidden">
                                <div className="grid grid-cols-3 bg-slate-800 p-4 border-b border-slate-700 font-bold">

                                    <div>Rate</div>
                                    <div>Verdict</div>
                                </div>
                                <div className="grid grid-cols-3 p-4 border-b border-slate-700 items-center">

                                    <div>Keep it (Cheaper than PG&E)</div>
                                </div>
                                <div className="grid grid-cols-3 p-4 items-center">
                                    <div className="text-red-400">Bad Provider</div>
                                    <div>$0.32 / kWh</div>
                                    <div>Buyout or Negotiate</div>
                                </div>
                            </div>

                                            <span>{step}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "UCC-1: The Title Hurdle",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="tpo_ucc" alt="UCC-1" fallback={null} />
                                <p className="text-xl">The solar company files a UCC-1 on the title. <br/>This is NOT a lien on the home, but it acts like one. <br/><span className="text-yellow-500">Must be temporarily lifted for refinancing or transferred for selling.</span></p>
                            </div>

                                    <div className="flex items-center mb-2">
                                        <BookOpen className="text-yellow-500 mr-2" />

                            {index + 1} / {total}

                    {/* Slide Content */}
                    <div className="flex-grow flex flex-col items-center justify-center p-8 text-center overflow-y-auto min-h-0">

                    <div className="p-6 bg-slate-800 flex justify-between items-center border-t border-slate-700">

                        <p>&copy; {new Date().getFullYear()} Rocklin Solar Repair. All Rights Reserved.</p>
                        <p className="text-sm">CA License # 1050566 • Bonded • Insured • v{APP_VERSION}</p>

            return (

                                        <span className="font-bold text-lg leading-none text-slate-100 hidden sm:block">Rocklin Solar Repair</span>
                                        <span className="text-xs text-yellow-500 hidden sm:block font-bold">Lic# 1050566</span>
                                    </div>
                                    <span className="font-bold text-lg md:text-xl text-slate-100 sm:hidden">RSR</span>
                                </div>

                                <nav className="hidden md:flex space-x-6 text-sm font-medium text-slate-300">

                                    <button onClick={() => handleTabChange('tpo')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'tpo' ? 'text-yellow-500' : ''}`}>TPO & Leases</button>
                                    <button onClick={() => handleTabChange('sellers')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'sellers' ? 'text-yellow-500' : ''}`}>For Sellers</button>
                                    <button onClick={() => handleTabChange('checklist')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'checklist' ? 'text-yellow-500' : ''}`}>Agent Checklist</button>

                                    <button 
                                        onClick={togglePresentation} 
                                        className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-md text-sm font-bold transition-colors border border-slate-600"

                                <div className="md:hidden bg-slate-800 border-t border-slate-700 p-4 space-y-4">
                                    <button onClick={() => handleTabChange('home')} className="block w-full text-left text-slate-300">Home</button>
                                    <button onClick={() => handleTabChange('inspections')} className="block w-full text-left text-slate-300">Inspections 101</button>
                                    <button onClick={() => handleTabChange('tpo')} className="block w-full text-left text-slate-300">TPO & Leases</button>
                                    <button onClick={() => handleTabChange('sellers')} className="block w-full text-left text-slate-300">For Sellers</button>
                                    <button onClick={() => handleTabChange('checklist')} className="block w-full text-left text-slate-300">Agent Checklist</button>
                                    <div className="pt-4 border-t border-slate-700 text-yellow-500 font-bold text-center">916-741-0194</div>
                                </div>
                            )}
                        </header>
                    )}

                    {isPresenting ? (
                        <div className="h-screen w-full fixed inset-0 z-50 bg-slate-900">
                            <button 
                                onClick={togglePresentation}
                                className="absolute top-4 right-4 z-50 p-2 bg-slate-800/50 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition"
                            >
                                <X size={24} />
                            </button>
                            <SlideView 
                                data={contentData[activeTab][currentSlide]} 
                                index={currentSlide} 
                                total={contentData[activeTab].length} 
                            />
                        </div>
                    ) : (
                        <WebModeView data={contentData[activeTab]} />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
