<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocklin Solar Repair</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (to compile JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Standalone Icon Definitions ---
    const createIcon = (paths) => ({ size = 24, className = "", strokeWidth = 2 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
        {paths}
      </svg>
    );

    const Sun = createIcon(<><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></>);
    const CheckCircle = createIcon(<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>);
    const AlertTriangle = createIcon(<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>);
    const FileText = createIcon(<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></>);
    const Home = createIcon(<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>);
    const Camera = createIcon(<><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>);
    const ChevronRight = createIcon(<polyline points="9 18 15 12 9 6"/>);
    const ChevronLeft = createIcon(<polyline points="15 18 9 12 15 6"/>);
    const X = createIcon(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>);
    const Maximize2 = createIcon(<><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></>);
    const Minimize2 = createIcon(<><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></>);
    const Upload = createIcon(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>);
    const ClipboardList = createIcon(<><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></>);
    const DollarSign = createIcon(<><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>);
    const ShieldAlert = createIcon(<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>);
    const Menu = createIcon(<><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>);
    const HelpCircle = createIcon(<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></>);
    const Search = createIcon(<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>);
    const Phone = createIcon(<><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></>);
    const MapPin = createIcon(<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>);
    const Wrench = createIcon(<><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></>);
    const Scale = createIcon(<><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></>);
    const TrendingUp = createIcon(<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>);
    const Clock = createIcon(<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>);

const App = () => {
  // --- State Management ---
  const [activeTab, setActiveTab] = useState('home');
  const [presentationMode, setPresentationMode] = useState(false);
  const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

  // Photo Upload State
  const [uploadedPhotos, setUploadedPhotos] = useState({
    wiring: null,
    soiling: null,
    racking: null
  });

  useEffect(() => {
    setCurrentSlideIndex(0);
    setPresentationMode(false);
    setIsMobileMenuOpen(false);
  }, [activeTab]);

  const handlePhotoUpload = (category, event) => {
    const file = event.target.files[0];
    if (file) {
      const imageUrl = URL.createObjectURL(file);
      setUploadedPhotos(prev => ({
        ...prev,
        [category]: imageUrl
      }));
    }
  };

  // --- Content Data Structure ---
  const contentData = {
    home: [
      {
        title: "Rocklin Solar Repair",
        subtitle: "Local Experts in Solar Inspections, Service & Repair",
        type: "hero",
        content: "Serving Placer, Sacramento, Nevada, Yolo, Sutter & El Dorado Counties.",
        icon: <Sun className="w-20 h-20 text-yellow-500" />
      },
      {
        title: "The Agent's Safe Harbor",
        type: "text",
        content: "We are strictly an inspection and repair company, not a sales organization. We provide unbiased assessments with NO pressure to buy a new system.",
        icon: <ShieldAlert className="w-12 h-12 text-blue-600" />
      },
      {
        title: "Our Services",
        type: "list",
        items: [
          "Real Estate Transaction Inspections",
          "System Maintenance & Repair",
          "Bird Guard Installation",
          "Solar Panel Cleaning"
        ],
        icon: <Wrench className="w-12 h-12 text-slate-700" />
      }
    ],
    inspections: [
      {
        title: "Inspections 101",
        subtitle: "Why inspect? 80% have issues.",
        type: "hero",
        content: "Most home inspectors do NOT touch solar. We bridge the gap. In our experience, 80% of systems have issues that pose a risk to the buyer.",
        icon: <AlertTriangle className="w-16 h-16 text-orange-500" />
      },
      {
        title: "Goal 1: Installation",
        type: "comparison",
        leftTitle: "City Inspector",
        leftContent: "Checks for basic code compliance and structural safety at the time of install. They often stay on the ground.",
        rightTitle: "Our Inspection",
        rightContent: "A top-to-bottom physical check. We verify the condition of equipment, wiring, and racking years after the initial install.",
        icon: <Home className="w-12 h-12 text-blue-600" />
      },
      {
        title: "Goal 2: Performance",
        type: "text",
        content: "Is it actually saving money? We review the system's lifetime production against what was promised. If the inverter is dead, the home is just an expensive roof ornament.",
        icon: <DollarSign className="w-12 h-12 text-green-600" />
      },
      {
        title: "Goal 3: Client Education",
        subtitle: "Answering the Buyer's Questions",
        type: "list",
        items: [
          "What is my annual savings expectation?",
          "Who do I call to transfer ownership?",
          "Is there an active warranty?",
          "How do I monitor it on my phone?",
          "Who do I call for service?"
        ],
        icon: <HelpCircle className="w-12 h-12 text-purple-600" />
      },
      {
        title: "From the Field",
        subtitle: "Common Issues We Find",
        type: "photo-upload",
        content: "Upload examples from recent inspections to show agents what '80% failure' looks like.",
        icon: <Camera className="w-12 h-12 text-slate-500" />
      }
    ],
    tpo: [
      {
        title: "Mastering Solar Contracts",
        subtitle: "Handshake or Handcuffs?",
        type: "hero",
        content: "Solar transfers are a common cause of delayed closings. TPO systems (Leases/PPAs) are 20-25 year commitments. We help you distinguish a routine transfer from a 'deal killer'.",
        icon: <FileText className="w-16 h-16 text-indigo-600" />
      },
      {
        title: "TPO 101: Lease vs. PPA",
        type: "comparison",
        leftTitle: "The Lease (Rent)",
        leftContent: "Homeowner pays a fixed monthly 'rent' for the equipment. They use all the power produced. It's like leasing a car—flat fee regardless of mileage.",
        rightTitle: "The PPA (Power Bill)",
        rightContent: "Homeowner pays for the power generated at a set rate per kWh. It's like a utility bill—you pay for what you produce.",
        icon: <Scale className="w-12 h-12 text-blue-600" />
      },
      {
        title: "The Big 5 Framework",
        subtitle: "The only variables that matter.",
        type: "list",
        items: [
          "1. Price: Monthly payment amount or Cost per kWh.",
          "2. Escalator: Does the cost rise annually? (Compound interest is powerful).",
          "3. Transfer: Credit requirements (FICO 650+) and assignment fees.",
          "4. Guarantee: Is production guaranteed? Is there a refund (True-Up)?",
          "5. Equipment: Quality of panels and inverter maintenance responsibilities."
        ],
        icon: <CheckCircle className="w-12 h-12 text-green-600" />
      },
      {
        title: "The Silent Killer: Escalators",
        subtitle: "Compound Interest over 20 Years",
        type: "comparison",
        leftTitle: "0% vs 2.9% (Manageable)",
        leftContent: "0% is best (flat forever). 2.9% is standard for older contracts. A $150 bill becomes $199 in Year 10 and $265 in Year 20.",
        rightTitle: "3.5% (Aggressive)",
        rightContent: "A 3.5% escalator is dangerous. A $150 bill becomes $300 in Year 20. This often exceeds utility rates, making the home harder to sell.",
        icon: <TrendingUp className="w-12 h-12 text-red-500" />
      },
      {
        title: "Case Study: Good vs. Bad",
        subtitle: "Real Provider Comparisons",
        type: "table",
        headers: ["Feature", "The Bad (Provider A)", "The Good (Provider B)"],
        rows: [
          ["Starting Rate", "$0.310 / kWh", "$0.150 / kWh"],
          ["Escalator", "3.50% Annually", "2.90% Annually"],
          ["Est. Payment (Yr 1)", "~$295 / month", "~$106 / month"],
          ["Break-even Point", "Immediate loss vs Grid", "Immediate savings vs Grid"],
          ["Impact on Sale", "High Risk: Buyer Refusal", "Low Risk: Asset to Home"]
        ],
        icon: <Search className="w-12 h-12 text-slate-600" />
      },
      {
        title: "The Transfer Process",
        subtitle: "Don't Wait Until Closing",
        type: "list",
        items: [
          "Step 1: Notify Solar Company immediately upon listing.",
          "Step 2: Buyer submits credit application (Usually FICO 650+).",
          "Step 3: Review the Transfer Agreement.",
          "Step 4: Seller clears any outstanding payments.",
          "Step 5: Title company records the UCC-1 termination/refiling."
        ],
        icon: <Clock className="w-12 h-12 text-blue-500" />
      },
      {
        title: "Title Issues: UCC-1",
        type: "text",
        content: "A UCC-1 is a 'Fixture Filing' that appears on the title report. It indicates a TPO system. Sellers often mistakenly believe they own the system because they forget about the lease. The Preliminary Title Report reveals the truth.",
        icon: <FileText className="w-12 h-12 text-yellow-600" />
      }
    ],
    sellers: [
      {
        title: "Preparing for Sale",
        subtitle: "Turn a Liability into an Asset",
        type: "hero",
        content: "A confusing solar system scares buyers. A well-documented, performing system justifies a higher asking price.",
        icon: <Home className="w-16 h-16 text-green-600" />
      },
      {
        title: "The Financial One-Pager",
        type: "comparison",
        leftTitle: "Without Data",
        leftContent: "Buyer sees a monthly lease payment and assumes it's a debt/burden.",
        rightTitle: "With Our Report",
        rightContent: "Buyer sees a $10 utility bill vs. a $300 neighbor's bill. The solar payment is now an investment, not a debt.",
        icon: <FileText className="w-12 h-12 text-blue-600" />
      },
      {
        title: "The NEM 2.0 Asset",
        type: "text",
        content: "In PG&E territory, 'Grandfathered' NEM 2.0 status stays with the meter/system, not the owner. Verify this via the Utility Bill. This status is worth thousands in avoided costs compared to new NEM 3.0 rates.",
        icon: <Sun className="w-12 h-12 text-yellow-500" />
      }
    ],
    checklist: [
      {
        title: "Agent Checklist",
        subtitle: "Documents needed BEFORE listing",
        type: "hero",
        content: "Don't wait until closing. Collect these 4 items immediately to prevent escrow delays.",
        icon: <ClipboardList className="w-16 h-16 text-teal-600" />
      },
      {
        title: "1. The Contract",
        type: "text",
        content: "Don't rely on memory. Get the TPO agreement to check the 'Big 5': Price, Escalator, Transfer fees, Guarantee, and Equipment quality.",
        icon: <FileText className="w-12 h-12 text-indigo-600" />
      },
      {
        title: "2. Title Report",
        type: "text",
        content: "Confirm ownership early. Look for the UCC-1 filing. If it exists, it's likely a TPO system. Note the company name listed.",
        icon: <Search className="w-12 h-12 text-slate-500" />
      },
      {
        title: "3. Utility Bill",
        type: "text",
        content: "Ask for 12 months of bills or the 'True-Up' statement. This confirms annual usage and the Net Metering program (NEM 2.0 vs 3.0).",
        icon: <DollarSign className="w-12 h-12 text-green-600" />
      },
      {
        title: "4. Schedule Inspection",
        type: "text",
        content: "Verify the system is actually working. A broken inverter discovered during the final walkthrough is a guaranteed closing delay.",
        icon: <Wrench className="w-12 h-12 text-purple-600" />
      }
    ]
  };

  // --- Components ---

  const NavItem = ({ id, label, icon: Icon }) => (
    <button
      onClick={() => setActiveTab(id)}
      className={`flex items-center space-x-2 px-4 py-3 rounded-lg transition-all duration-200 w-full md:w-auto text-left
        ${activeTab === id 
          ? 'bg-yellow-500 text-slate-900 shadow-md font-bold' 
          : 'text-slate-300 hover:bg-slate-800 hover:text-white'
        }`}
    >
      <Icon size={20} />
      <span>{label}</span>
    </button>
  );

  const PhotoUploadCard = ({ category, label }) => (
    <div className="bg-white p-6 rounded-xl shadow-md border border-slate-200 flex flex-col items-center text-center hover:shadow-lg transition-shadow">
      <h3 className="font-bold text-lg text-slate-800 mb-4">{label}</h3>
      
      <div className="w-full aspect-video bg-slate-100 rounded-lg mb-4 flex items-center justify-center overflow-hidden relative group">
        {uploadedPhotos[category] ? (
          <>
            <img 
              src={uploadedPhotos[category]} 
              alt={label} 
              className="w-full h-full object-cover"
            />
            <div className="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
               <span className="text-white text-sm font-medium">Click to Change</span>
            </div>
          </>
        ) : (
          <div className="text-slate-400 flex flex-col items-center">
            <Camera size={40} className="mb-2" />
            <span className="text-sm">No photo uploaded</span>
          </div>
        )}
        <input 
          type="file" 
          accept="image/*"
          onChange={(e) => handlePhotoUpload(category, e)}
          className="absolute inset-0 opacity-0 cursor-pointer"
        />
      </div>
      
      <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2 border border-slate-300">
        <Upload size={16} />
        {uploadedPhotos[category] ? 'Replace Photo' : 'Upload Photo'}
        <input 
          type="file" 
          accept="image/*"
          onChange={(e) => handlePhotoUpload(category, e)}
          className="hidden"
        />
      </label>
    </div>
  );

  // --- Renderers ---

  const renderSlideContent = (slide) => {
    switch (slide.type) {
      case 'hero':
        return (
          <div className="text-center max-w-5xl mx-auto">
            <div className="flex justify-center mb-8 animate-bounce-slow">
              {slide.icon}
            </div>
            <h1 className={`${presentationMode ? 'text-6xl' : 'text-5xl'} font-extrabold text-slate-900 mb-6 tracking-tight`}>
              {slide.title}
            </h1>
            <h2 className={`${presentationMode ? 'text-4xl' : 'text-2xl'} font-medium text-blue-700 mb-8`}>
              {slide.subtitle}
            </h2>
            <p className={`${presentationMode ? 'text-3xl' : 'text-xl'} text-slate-600 leading-relaxed max-w-3xl mx-auto`}>
              {slide.content}
            </p>
          </div>
        );
      case 'list':
        return (
          <div className="max-w-5xl mx-auto w-full">
            <div className="flex items-center gap-4 mb-8">
              {slide.icon}
              <h2 className={`${presentationMode ? 'text-5xl' : 'text-4xl'} font-bold text-slate-900`}>{slide.title}</h2>
            </div>
            {slide.subtitle && (
              <h3 className={`${presentationMode ? 'text-3xl' : 'text-2xl'} text-blue-700 mb-8 font-semibold`}>{slide.subtitle}</h3>
            )}
            <ul className="space-y-6">
              {slide.items.map((item, idx) => (
                <li key={idx} className={`flex items-start gap-4 p-6 bg-white rounded-xl shadow-sm border-l-4 border-yellow-500 ${presentationMode ? 'text-3xl' : 'text-xl'} text-slate-800`}>
                  <div className="mt-1 min-w-[24px]">
                    <ChevronRight className="text-blue-600" strokeWidth={3} />
                  </div>
                  {item}
                </li>
              ))}
            </ul>
          </div>
        );
      case 'comparison':
        return (
          <div className="max-w-6xl mx-auto w-full">
            <h2 className={`${presentationMode ? 'text-5xl' : 'text-4xl'} font-bold text-slate-900 text-center mb-12`}>{slide.title}</h2>
            <div className="grid md:grid-cols-2 gap-8">
              <div className="bg-red-50 p-10 rounded-2xl border-2 border-red-100 shadow-sm">
                <h3 className={`${presentationMode ? 'text-3xl' : 'text-2xl'} font-bold text-red-700 mb-4 flex items-center gap-2`}>
                   <X className="w-8 h-8" /> {slide.leftTitle}
                </h3>
                <p className={`${presentationMode ? 'text-2xl' : 'text-lg'} text-red-900/80 leading-relaxed`}>{slide.leftContent}</p>
              </div>
              <div className="bg-green-50 p-10 rounded-2xl border-2 border-green-100 shadow-sm">
                <h3 className={`${presentationMode ? 'text-3xl' : 'text-2xl'} font-bold text-green-700 mb-4 flex items-center gap-2`}>
                   <CheckCircle className="w-8 h-8" /> {slide.rightTitle}
                </h3>
                <p className={`${presentationMode ? 'text-2xl' : 'text-lg'} text-green-900/80 leading-relaxed`}>{slide.rightContent}</p>
              </div>
            </div>
          </div>
        );
      case 'table':
        return (
          <div className="max-w-6xl mx-auto w-full">
             <div className="flex items-center gap-4 mb-8 justify-center">
              {slide.icon}
              <h2 className={`${presentationMode ? 'text-5xl' : 'text-4xl'} font-bold text-slate-900`}>{slide.title}</h2>
            </div>
             <h3 className={`${presentationMode ? 'text-3xl' : 'text-2xl'} text-blue-700 mb-8 font-semibold text-center`}>{slide.subtitle}</h3>
             
             <div className="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
               <div className="grid grid-cols-3 bg-slate-900 text-white p-6 font-bold text-lg md:text-xl">
                 {slide.headers.map((header, idx) => (
                   <div key={idx} className={idx === 0 ? "text-left" : "text-center"}>{header}</div>
                 ))}
               </div>
               {slide.rows.map((row, idx) => (
                 <div key={idx} className={`grid grid-cols-3 p-6 border-b border-slate-100 items-center ${idx % 2 === 0 ? 'bg-slate-50' : 'bg-white'}`}>
                   <div className={`font-bold text-slate-700 ${presentationMode ? 'text-2xl' : 'text-lg'}`}>{row[0]}</div>
                   <div className={`text-center text-red-600 font-medium ${presentationMode ? 'text-2xl' : 'text-lg'}`}>{row[1]}</div>
                   <div className={`text-center text-green-600 font-bold ${presentationMode ? 'text-2xl' : 'text-lg'}`}>{row[2]}</div>
                 </div>
               ))}
             </div>
          </div>
        );
      case 'photo-upload':
        return (
          <div className="max-w-6xl mx-auto w-full">
            <h2 className={`${presentationMode ? 'text-5xl' : 'text-4xl'} font-bold text-slate-900 mb-6 text-center`}>{slide.title}</h2>
            <p className="text-center text-slate-600 mb-12 max-w-2xl mx-auto text-xl">{slide.content}</p>
            
            <div className="grid md:grid-cols-3 gap-8">
              <PhotoUploadCard category="wiring" label="Exposed Wiring" />
              <PhotoUploadCard category="soiling" label="Heavy Soiling" />
              <PhotoUploadCard category="racking" label="Racking Damage" />
            </div>
          </div>
        );
      default: // text
        return (
          <div className="max-w-5xl mx-auto">
            <div className="flex items-center gap-4 mb-8">
              {slide.icon}
              <h2 className={`${presentationMode ? 'text-5xl' : 'text-4xl'} font-bold text-slate-900`}>{slide.title}</h2>
            </div>
            {slide.subtitle && (
              <h3 className={`${presentationMode ? 'text-3xl' : 'text-2xl'} text-blue-700 mb-8 font-semibold`}>{slide.subtitle}</h3>
            )}
            <p className={`${presentationMode ? 'text-4xl leading-loose' : 'text-xl leading-loose'} text-slate-700`}>
              {slide.content}
            </p>
          </div>
        );
    }
  };

  // --- Main Render Block ---
  const currentSlides = contentData[activeTab];

  return (
    <div className={`min-h-screen font-sans ${presentationMode ? 'bg-slate-900' : 'bg-slate-50'}`}>
      
      {/* --- Navigation (Hidden in Presentation Mode) --- */}
      {!presentationMode && (
        <nav className="bg-slate-900 sticky top-0 z-50 shadow-lg border-b border-slate-800">
          {/* Top Bar Contact Info */}
          <div className="bg-yellow-500 text-slate-900 py-1 px-4 text-xs font-bold text-center sm:text-right sm:px-8">
            CALL NOW: 916-741-0194
          </div>
          
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between h-20">
              <div className="flex items-center gap-3">
                <Sun className="h-10 w-10 text-yellow-500" />
                <div className="flex flex-col">
                    <span className="font-extrabold text-xl text-white tracking-tight leading-none">ROCKLIN</span>
                    <span className="font-bold text-lg text-slate-300 tracking-wide leading-none">SOLAR REPAIR</span>
                </div>
              </div>
              
              {/* Desktop Nav */}
              <div className="hidden md:flex space-x-1 items-center">
                <NavItem id="home" label="Home" icon={Home} />
                <NavItem id="inspections" label="Inspections 101" icon={Camera} />
                <NavItem id="tpo" label="TPO & Leases" icon={FileText} />
                <NavItem id="sellers" label="For Sellers" icon={DollarSign} />
                <NavItem id="checklist" label="Agent Checklist" icon={ClipboardList} />
              </div>

              {/* Mobile Menu Button */}
              <div className="md:hidden flex items-center">
                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-white p-2 hover:bg-slate-800 rounded">
                  {isMobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                </button>
              </div>
            </div>
          </div>
          
          {/* Mobile Nav Dropdown */}
          {isMobileMenuOpen && (
            <div className="md:hidden bg-slate-800 border-t border-slate-700 px-4 pt-2 pb-4 space-y-2 shadow-lg">
                <NavItem id="home" label="Home" icon={Home} />
                <NavItem id="inspections" label="Inspections 101" icon={Camera} />
                <NavItem id="tpo" label="TPO & Leases" icon={FileText} />
                <NavItem id="sellers" label="For Sellers" icon={DollarSign} />
                <NavItem id="checklist" label="Agent Checklist" icon={ClipboardList} />
            </div>
          )}
        </nav>
      )}

      {/* --- Content Area --- */}
      <main className={`transition-all duration-300 ${presentationMode ? 'h-screen w-screen overflow-hidden flex flex-col' : 'max-w-7xl mx-auto px-4 py-8 pb-32'}`}>
        
        {/* Presentation Toggle Bar */}
        <div className={`flex justify-end items-center mb-6 ${presentationMode ? 'absolute top-6 right-6 z-50' : ''}`}>
          <button 
            onClick={() => setPresentationMode(!presentationMode)}
            className={`flex items-center gap-2 px-6 py-2 rounded-full font-bold shadow-lg transition-all border-2
              ${presentationMode 
                ? 'bg-red-600 hover:bg-red-700 text-white border-red-500' 
                : 'bg-slate-900 hover:bg-slate-800 text-yellow-500 border-slate-900'
              }`}
          >
            {presentationMode ? (
              <>
                <Minimize2 size={18} /> Exit Presentation
              </>
            ) : (
              <>
                <Maximize2 size={18} /> Start Presentation
              </>
            )}
          </button>
        </div>

        {/* View Logic */}
        {presentationMode ? (
          // --- Presentation Mode View ---
          <div className="flex-1 bg-white flex items-center justify-center p-12 relative">
            {/* Slide Content */}
            <div className="w-full max-w-7xl animate-fade-in">
              {renderSlideContent(currentSlides[currentSlideIndex])}
            </div>

            {/* Navigation Controls */}
            <div className="absolute bottom-0 left-0 right-0 h-24 bg-slate-900 border-t border-slate-800 flex items-center justify-between px-12 text-white">
              <button 
                onClick={() => setCurrentSlideIndex(Math.max(0, currentSlideIndex - 1))}
                disabled={currentSlideIndex === 0}
                className="flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white font-bold hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
              >
                <ChevronLeft size={24} /> Previous
              </button>

              <div className="flex gap-2">
                {currentSlides.map((_, idx) => (
                  <div 
                    key={idx} 
                    className={`h-3 rounded-full transition-all duration-300 ${idx === currentSlideIndex ? 'w-12 bg-yellow-500' : 'w-3 bg-slate-700'}`}
                  />
                ))}
              </div>

              <button 
                onClick={() => setCurrentSlideIndex(Math.min(currentSlides.length - 1, currentSlideIndex + 1))}
                disabled={currentSlideIndex === currentSlides.length - 1}
                className="flex items-center gap-2 px-6 py-3 rounded-xl bg-yellow-500 text-slate-900 font-bold hover:bg-yellow-400 disabled:opacity-50 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed transition-colors shadow-md"
              >
                Next <ChevronRight size={24} />
              </button>
            </div>
          </div>
        ) : (
          // --- Web Scroll View ---
          <div className="space-y-16 animate-fade-in-up">
            {currentSlides.map((slide, idx) => (
              <div key={idx} className="bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                {renderSlideContent(slide)}
              </div>
            ))}
          </div>
        )}

      </main>

      {/* --- Footer (Web Only) --- */}
      {!presentationMode && (
        <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
          <div className="max-w-7xl mx-auto px-4 text-center">
            <div className="flex flex-col items-center gap-2 mb-6">
              <Sun className="text-yellow-500 h-12 w-12" />
              <span className="text-white font-extrabold text-2xl tracking-tight">ROCKLIN SOLAR REPAIR</span>
            </div>
            
            <div className="grid md:grid-cols-3 gap-8 text-sm mb-8 max-w-4xl mx-auto">
                <div className="flex flex-col items-center gap-2">
                    <Phone className="text-yellow-500" size={20} />
                    <span className="text-slate-300">916-741-0194</span>
                </div>
                <div className="flex flex-col items-center gap-2">
                    <MapPin className="text-yellow-500" size={20} />
                    <span className="text-slate-300">6518 Lonetree Blvd #2050<br/>Rocklin, CA 95765</span>
                </div>
                <div className="flex flex-col items-center gap-2">
                    <FileText className="text-yellow-500" size={20} />
                    <span className="text-slate-300">Contractors Lic #1050566<br/>Solar (C46) & General B</span>
                </div>
            </div>

            <p className="text-xs text-slate-600">© {new Date().getFullYear()} Rocklin Solar Repair. All rights reserved.</p>
          </div>
        </footer>
      )}

      {/* Custom Animations */}
      <style>{`
        @keyframes fadeIn {
          from { opacity: 0; transform: scale(0.98); }
          to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
          animation: fadeIn 0.4s ease-out forwards;
        }
        .animate-fade-in-up {
          animation: fadeInUp 0.5s ease-out forwards;
        }
      `}</style>
    </div>
  );
};

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
