                                            <td className="p-4">$150</td>
                                        </tr>
                                        <tr>
                                            <td className="p-4 font-bold text-yellow-400">2.9%</td>
                                            <td className="p-4">$150</td>
                                            <td className="p-4">$194</td>
                                            <td className="p-4">$258</td>
                                        </tr>
                                        <tr className="bg-red-900/20">
                                            <td className="p-4 font-bold text-red-400">3.5%</td>
                                            <td className="p-4">$150</td>
                                            <td className="p-4">$205</td>
                                            <td className="p-4">$290</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p className="mt-4 text-slate-400 text-sm">Compounding interest significantly reduces long-term value.</p>
                            </div>
                        )
                    },
                    {
                        title: "Discrepancy #1: Quantity",
                        headerLogo: projectImages.logo,
                        content: (
                            <div className="flex flex-col items-center">
                                <RenderImageOrFallback imageKey="slide_myth3" alt="27 vs 24 Panels" fallback={null} />
                                <div className="bg-slate-800 p-6 rounded-lg border-l-4 border-red-500 text-left mt-4 max-w-2xl">
                                    <h3 className="text-xl font-bold text-red-400 mb-2">Paperwork != Roof</h3>
                                    <p>The Lease Document listed <strong>27</strong> solar panels.</p>
                                    <p>Only <strong>24</strong> were actually installed.</p>
                                    <p className="mt-2 italic text-slate-400">We catch this during visual inspection.</p>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Performance Guarantees",
                        headerLogo: projectImages.logo,
                        content: (
                            <div className="flex flex-col gap-8 w-full max-w-6xl">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
                                    {/* Lease Logic */}
                                    <div className="bg-slate-800 p-8 rounded-xl border-t-8 border-yellow-500 text-left flex flex-col">
                                        <h3 className="text-3xl font-bold text-yellow-500 mb-4">Leases: The Guarantee Table</h3>
                                        <RenderImageOrFallback imageKey="tpo_guarantee_table" alt="Guarantee Table" fallback={<div className="bg-white text-slate-900 font-bold p-4 h-32 flex items-center justify-center mb-4 rounded border border-slate-400">Example: Year 1 - 10,000 kWh Guaranteed</div>} className="max-h-40 w-auto mb-4 self-center" />
                                        <p className="text-xl text-slate-200 mb-4 flex-grow">
                                            For a Lease (fixed monthly rent), this table is <strong>vital</strong>. It holds the company accountable. 
                                            If the system produces less than the guaranteed amount, they must compensate the homeowner.
                                        </p>
                                        <div className="bg-red-900/30 p-4 rounded border border-red-500 text-center">
                                            <p className="text-red-400 font-bold text-xl">No Table = No Recourse</p>
                                        </div>
                                    </div>

                                    {/* PPA Logic */}
                                    <div className="bg-slate-800 p-8 rounded-xl border-t-8 border-blue-500 text-left flex flex-col">
                                        <h3 className="text-3xl font-bold text-blue-500 mb-4">PPAs: "Self Policing"</h3>
                                        <div className="flex-grow">
                                            <p className="text-xl text-slate-200 mb-4">
                                                PPAs are pay-per-kWh. If the system underproduces, the bill drops automatically. You only pay for what is produced.
                                            </p>
                                            <div className="flex items-center gap-4 bg-slate-900 p-4 rounded border border-slate-700 mb-4">
                                                <Scale size={48} className="text-blue-500 flex-shrink-0" />
                                                <p className="text-lg text-slate-400 italic">
                                                    "If it doesn't work, you don't pay. No harm, no foul."
                                                </p>
                                            </div>
                                            <p className="text-lg text-slate-300">
                                                <strong className="text-white">The Catch:</strong> While you aren't paying the solar company, you lose the savings and buy expensive power from the utility instead.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Protecting Your Client",
                        headerLogo: projectImages.logo,
                        content: (
                            <div className="flex flex-col items-center justify-center h-full">
                                <p className="text-3xl text-slate-300 mb-12 max-w-4xl">Whether you represent the Seller or the Buyer, the solar agreement is a critical transaction point.</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-12 w-full max-w-6xl">
                                    {/* Listing Agent */}
                                    <div className="bg-slate-800 p-8 rounded-xl border-t-8 border-yellow-500 shadow-xl flex flex-col text-left">
                                        <div className="flex items-center mb-6">
                                            <div className="bg-yellow-500/20 p-4 rounded-full mr-4">
                                                <FileText size={40} className="text-yellow-500" />
                                            </div>
                                            <h3 className="text-3xl font-bold text-white">Listing Agent</h3>
                                        </div>
                                        <p className="text-xl text-slate-300 leading-relaxed mb-4">
                                            <strong>The Risk:</strong> A predatory TPO agreement (high escalator, low production) can scare off potential buyers or kill the deal during escrow.
                                        </p>
                                        <div className="mt-auto p-4 bg-yellow-500/10 rounded border border-yellow-500/30">
                                            <p className="text-lg text-yellow-200">
                                                <strong>Goal:</strong> Know the terms upfront. If it's a bad lease, prepare a strategy (buyout vs. concession) <em>before</em> listing.
                                            </p>
                                        </div>
                                    </div>

                                    {/* Buyer's Agent */}
                                    <div className="bg-slate-800 p-8 rounded-xl border-t-8 border-blue-500 shadow-xl flex flex-col text-left">
                                        <div className="flex items-center mb-6">
                                            <div className="bg-blue-500/20 p-4 rounded-full mr-4">
                                                <ShieldCheck size={40} className="text-blue-500" />
                                            </div>
                                            <h3 className="text-3xl font-bold text-white">Buyer's Agent</h3>
                                        </div>
                                        <p className="text-xl text-slate-300 leading-relaxed mb-4">
                                            <strong>The Risk:</strong> Your buyer might assume a liability that costs more than the utility company, with no way out for 20 years.
                                        </p>
                                        <div className="mt-auto p-4 bg-blue-500/10 rounded border border-blue-500/30">
                                            <p className="text-lg text-blue-200">
                                                <strong>Goal:</strong> Ensure the system works and the financial terms are favorable. Don't let them sign a bad deal blindly.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Let's Work Together",
                        headerLogo: projectImages.logo,
                        content: (
                            <div className="text-center flex flex-col items-center">
                                <div className="w-full max-w-sm mb-4">
                                    <RenderImageOrFallback imageKey="slide19_logo" alt="RSR Logo" fallback={<Sun size={80} className="text-yellow-500 mx-auto" />} />
                                </div>
                                <p className="text-3xl font-bold text-white mb-6">Rocklin Solar Repair</p>
                                <div className="inline-block bg-yellow-500 text-slate-900 px-8 py-4 rounded-lg text-3xl font-bold shadow-lg mb-8 hover:scale-105 transition-transform">916-741-0194</div>
                                <div className="w-full max-w-xs"><RenderImageOrFallback imageKey="qrCode" alt="Scan to Contact" fallback={null} /><p className="text-slate-400 font-bold">Scan QR to save contact</p></div>
                            </div>
                        )
                    }
                ],

                // --- SELLERS & CHECKLIST (PLACEHOLDERS) ---
                sellers: [
                    {
                        title: "For Sellers",
                        content: (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-4">Seller Resources</h3>
                                <p className="text-slate-400">Content coming soon...</p>
                            </div>
                        )
                    }
                ],
                checklist: [
                    {
                        title: "Agent Checklist",
                        content: (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-4">Agent Checklist</h3>
                                <p className="text-slate-400">Content coming soon...</p>
                            </div>
                        )
                    }
                ]
            };

            const SlideView = ({ data, index, total }) => (
                <div className="flex flex-col h-full bg-slate-900 text-slate-100 animate-fadeIn">
                    <div className="p-8 pb-0 flex justify-between items-start">
                        <div className="flex-1">
                            <h2 className="text-5xl md:text-7xl font-bold text-yellow-500 mb-2 tracking-tight">{data.title}</h2>
                            {data.subtitle && <h3 className="text-3xl text-slate-400">{data.subtitle}</h3>}
                        </div>
                        <div className="flex items-start gap-6">
                            {data.headerLogo && (
                                <img src={data.headerLogo} className="h-24 w-auto object-contain hidden md:block" alt="Header Logo" />
                            )}
                            <div className="flex flex-col items-end">
                                <span className="text-yellow-500 text-5xl font-bold font-mono">{index + 1}</span>
                                <span className="text-slate-500 text-xl font-mono">of {total}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex-grow flex flex-col items-center justify-center p-8 text-center overflow-y-auto min-h-0">
                        <div className="w-full max-w-7xl">
                            {data.content}
                        </div>
                    </div>

                    <div className="p-6 bg-slate-800 flex justify-between items-center border-t border-slate-700">
                        <button 
                            onClick={prevSlide} 
                            disabled={index === 0}
                            className="flex items-center px-8 py-4 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 rounded-lg text-2xl font-bold transition"
                        >
                            <ChevronLeft className="mr-2" size={32} /> Previous
                        </button>
                        <div className="text-slate-400 text-lg uppercase tracking-widest hidden md:block">
                            Rocklin Solar Repair • Presentation Mode • v{APP_VERSION}
                        </div>
                        <button 
                            onClick={nextSlide} 
                            disabled={index === total - 1}
                            className="flex items-center px-8 py-4 bg-yellow-500 hover:bg-yellow-400 text-slate-900 rounded-lg text-2xl font-bold transition"
                        >
                            Next <ChevronRight className="ml-2" size={32} />
                        </button>
                    </div>
                </div>
            );

            const WebModeView = ({ data }) => (
                <div className="container mx-auto px-4 py-12 max-w-4xl">
                    {data.map((item, idx) => (
                        <div key={idx} className="mb-16 bg-slate-800 rounded-xl p-8 border border-slate-700 shadow-xl">
                            <div className="mb-6 border-b border-slate-700 pb-4 flex justify-between items-start">
                                <div>
                                    <h2 className="text-3xl font-bold text-yellow-500">{item.title}</h2>
                                    {item.subtitle && <p className="text-xl text-slate-400 mt-1">{item.subtitle}</p>}
                                </div>
                                <div className="flex items-center gap-4">
                                    {item.headerLogo && (
                                        <img src={item.headerLogo} alt="Header Logo" className="h-16 w-auto object-contain" />
                                    )}
                                    <span className="text-slate-600 font-mono text-4xl font-bold opacity-30 select-none">
                                        {String(idx + 1).padStart(2, '0')}
                                    </span>
                                </div>
                            </div>
                            <div className="text-slate-200 text-lg leading-relaxed">
                                {item.content}
                            </div>
                        </div>
                    ))}
                    <footer className="text-center py-8 text-slate-500 border-t border-slate-800 mt-8 space-y-2">
                        <p>&copy; {new Date().getFullYear()} Rocklin Solar Repair. All Rights Reserved.</p>
                        <p className="text-sm">CA License # 1050566 • Bonded • Insured • v{APP_VERSION}</p>
                    </footer>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 font-sans selection:bg-yellow-500 selection:text-slate-900">
                    {!isPresenting && (
                        <header className="bg-slate-900 border-b border-slate-700 sticky top-0 z-50">
                            <div className="container mx-auto px-4 h-16 flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                    <Sun className="text-yellow-500 fill-yellow-500/20" />
                                    <div className="flex flex-col">
                                        <span className="font-bold text-lg leading-none text-slate-100 hidden sm:block">Rocklin Solar Repair</span>
                                        <span className="text-xs text-yellow-500 hidden sm:block font-bold">Lic# 1050566</span>
                                    </div>
                                    <span className="font-bold text-lg md:text-xl text-slate-100 sm:hidden">RSR</span>
                                </div>

                                <nav className="hidden md:flex space-x-6 text-sm font-medium text-slate-300">
                                    <button onClick={() => handleTabChange('home')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'home' ? 'text-yellow-500' : ''}`}>Home</button>
                                    <button onClick={() => handleTabChange('inspections')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'inspections' ? 'text-yellow-500' : ''}`}>Inspections 101</button>
                                    <button onClick={() => handleTabChange('tpo')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'tpo' ? 'text-yellow-500' : ''}`}>TPO & Leases</button>
                                    <button onClick={() => handleTabChange('sellers')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'sellers' ? 'text-yellow-500' : ''}`}>For Sellers</button>
                                    <button onClick={() => handleTabChange('checklist')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'checklist' ? 'text-yellow-500' : ''}`}>Agent Checklist</button>
                                </nav>

                                <div className="flex items-center space-x-4">
                                    <a href="tel:9167410194" className="hidden lg:flex items-center text-yellow-500 font-bold bg-yellow-500/10 px-3 py-1 rounded-full hover:bg-yellow-500 hover:text-slate-900 transition-all">
                                        <Phone size={16} className="mr-2" /> 916-741-0194
                                    </a>
                                    <button 
                                        onClick={togglePresentation} 
                                        className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-md text-sm font-bold transition-colors border border-slate-600"
                                    >
                                        {isPresenting ? "Exit Mode" : "Presentation Mode"}
                                    </button>
                                    <button className="md:hidden text-slate-300" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                        {isMobileMenuOpen ? <X /> : <Menu />}
                                    </button>
                                </div>
                            </div>

                            {isMobileMenuOpen && (
                                <div className="md:hidden bg-slate-800 border-t border-slate-700 p-4 space-y-4">
                                    <button onClick={() => handleTabChange('home')} className="block w-full text-left text-slate-300">Home</button>
                                    <button onClick={() => handleTabChange('inspections')} className="block w-full text-left text-slate-300">Inspections 101</button>
                                    <button onClick={() => handleTabChange('tpo')} className="block w-full text-left text-slate-300">TPO & Leases</button>
                                    <button onClick={() => handleTabChange('sellers')} className="block w-full text-left text-slate-300">For Sellers</button>
                                    <button onClick={() => handleTabChange('checklist')} className="block w-full text-left text-slate-300">Agent Checklist</button>
                                    <div className="pt-4 border-t border-slate-700 text-yellow-500 font-bold text-center">916-741-0194</div>
                                </div>
                            )}
                        </header>
                    )}

                    {isPresenting ? (
                        <div className="h-screen w-full fixed inset-0 z-50 bg-slate-900">
                            <button 
                                onClick={togglePresentation}
                                className="absolute top-4 right-4 z-50 p-2 bg-slate-800/50 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition"
                            >
                                <X size={24} />
                            </button>
                            <SlideView 
                                data={contentData[activeTab][currentSlide]} 
                                index={currentSlide} 
                                total={contentData[activeTab].length} 
                            />
                        </div>
                    ) : (
                        <WebModeView data={contentData[activeTab]} />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
