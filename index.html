<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocklin Solar Repair Resource Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM & Babel -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #0f172a; color: white; }
        /* Custom Scrollbar for presentation content */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #eab308; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ca8a04; }
        
        /* Animation utilities */
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        /*
          =========================================================================
          *** ROCKLIN SOLAR REPAIR WEB APP - MASTER CONTEXT ***
          =========================================================================
        */

        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Sun, ChevronRight, ChevronLeft, Camera, FileText, CheckCircle, 
            AlertTriangle, Home, DollarSign, Menu, X, Phone, Upload, 
            BookOpen, ShieldCheck, Wrench, Image as ImageIcon, BarChart3,
            MapPin, Calendar, Award, Maximize2, Minimize2, ExternalLink,
            ThumbsUp, ThumbsDown, Scale, FileSearch
        } from 'lucide-react';

        const APP_VERSION = "1.2.1";

        // --- IMAGE CONFIGURATION LIST ---
        const projectImages = {
            // --- HOME PAGE ---
            logo: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/RSR%20Logo%20Sun.png?raw=true", 
            
            // --- INSPECTIONS 101 ---
            qrCode: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/QR%20code.png?raw=true",
            slide_goal: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Happy%20couple%20with%20agent.jpg?raw=true",
            slide_reality: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/8%20out%20of%2010%20houses%20have%20issues.jpg?raw=true",
            slide_confusion: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Solar%20salesman.png?raw=true",
            slide_ownership: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/two%20ways%20to%20get%20solar.jpg?raw=true",
            slide_goals: null, 
            slide_cost: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/$299%20is%20a%20value.jpg?raw=true",
            
            slide_myth1: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/New%20solar%20home.jpg?raw=true",
            slide_myth2: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Utility%20bill.png?raw=true",
            slide_myth3: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Leased%20system.png?raw=true",

            slide_wildwest: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Gold%20miner.png?raw=true",
            slide_inspector: null,
            slide_report: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Spectora%20report.png?raw=true",
            
            slide_fixit: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Erin%20Steve%20Rob.jpg?raw=true",
            slide_service: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Solar%20panel%20cleaning.png?raw=true",
            cslb_logo: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/CSLB%20Logo.png?raw=true",

            slide17_app: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/battery%20app.png?raw=true",
            slide17_pic: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/battery%20pic.png?raw=true",
            
            slide_questions: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Confused%20homeowners.png?raw=true",
            slide19_logo: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/RSR%20Logo%20Sun.png?raw=true",

            slide12_wiring: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/Exposed%20wire.jpg?raw=true",
            slide12_flashing: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/No%20flashing.png?raw=true",
            slide12_negligence: "https://github.com/erinjclark-jpg/solar-app/blob/main/images/End%20clamp%20not%20installed.png?raw=true",

            // --- TPO & LEASES (ACTIVE) ---
            tpo_options: null,             
            tpo_logos: null,               
            tpo_contract: null,            
            tpo_discrepancy_panels: null,  
            tpo_discrepancy_equip: null,   
            tpo_guarantee_table: null,     
            tpo_no_guarantee: null,        
            
            // --- FOR SELLERS ---
            seller_health_check: null, 
            one_pager_example: null, 
            nem_chart: null 
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState(() => {
                const hash = window.location.hash.replace('#', '');
                const validTabs = ['home', 'inspections', 'tpo', 'sellers', 'checklist'];
                return validTabs.includes(hash) ? hash : 'home';
            });

            const [isPresenting, setIsPresenting] = useState(false);
            const [currentSlide, setCurrentSlide] = useState(0);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [uploadedImages, setUploadedImages] = useState({
                wiring: null,
                flashing: null,
                negligence: null
            });

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('presentation') === 'true') {
                    setIsPresenting(true);
                }
            }, []);

            const handleTabChange = (tab) => {
                setActiveTab(tab);
                window.location.hash = tab; 
                setCurrentSlide(0);
                setIsPresenting(false);
                setIsMobileMenuOpen(false);
            };

            const togglePresentation = () => {
                // DETECT IF RUNNING IN IFRAME
                const isInIframe = window.self !== window.top;

                // If in iframe and entering presentation mode, open in new tab
                if (isInIframe && !isPresenting) {
                    const url = new URL(window.location.href);
                    url.searchParams.set('presentation', 'true');
                    url.hash = activeTab;
                    window.open(url.toString(), '_blank');
                    return;
                }

                const newIsPresenting = !isPresenting;
                setIsPresenting(newIsPresenting);
                setCurrentSlide(0);
                setIsMobileMenuOpen(false);

                if (newIsPresenting) {
                    const elem = document.documentElement;
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(err => console.log(err));
                    }
                } else {
                    if (document.exitFullscreen && document.fullscreenElement) {
                        document.exitFullscreen().catch(err => console.log(err));
                    }
                }
            };

            const nextSlide = () => {
                const totalSlides = contentData[activeTab].length;
                if (currentSlide < totalSlides - 1) setCurrentSlide(currentSlide + 1);
            };

            const prevSlide = () => {
                if (currentSlide > 0) setCurrentSlide(currentSlide - 1);
            };

            const handleImageUpload = (key, event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setUploadedImages(prev => ({
                            ...prev,
                            [key]: reader.result
                        }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            // UPDATED: Significantly larger max-height for presentation visibility
            const RenderImageOrFallback = ({ imageKey, alt, fallback }) => {
                if (projectImages[imageKey]) {
                    return (
                        <div className="w-full flex justify-center mb-6">
                            <img 
                                src={projectImages[imageKey]} 
                                alt={alt} 
                                className="max-h-[50vh] md:max-h-[65vh] rounded-lg shadow-lg object-contain border border-slate-700 bg-slate-800"
                                onError={(e) => {
                                    e.target.onerror = null; 
                                    e.target.style.display = 'none';
                                    if (e.target.nextSibling) e.target.nextSibling.style.display = 'block';
                                }}
                            />
                            <div className="hidden">{fallback}</div>
                        </div>
                    );
                }
                return fallback;
            };

            // --- Data / Content Structure ---
            const contentData = {
                // =========================================================================
                // *** LOCKED CONTENT: HOME PAGE ***
                // =========================================================================
                home: [
                    {
                        title: "Rocklin Solar Repair",
                        subtitle: "The Real Estate Agent's Secret Weapon",
                        content: (
                            <div className="text-center space-y-8">
                                <div className="flex justify-center mb-6">
                                    {projectImages.logo ? (
                                        <img src={projectImages.logo} alt="RSR Logo" className="h-48 object-contain" />
                                    ) : (
                                        <div className="relative">
                                            <Sun size={120} className="text-yellow-500" />
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <Wrench size={50} className="text-slate-900" />
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                <h1 className="text-4xl md:text-6xl font-bold text-white tracking-tight">
                                    Real Estate Inspections <span className="text-yellow-500">&</span> System Repairs
                                </h1>

                                <p className="text-2xl md:text-4xl text-slate-300 max-w-4xl mx-auto leading-relaxed">
                                    We are strictly an <span className="text-white font-bold">inspection and repair company</span>, 
                                    not a sales organization. We provide unbiased assessments with no pressure to buy a new system.
                                </p>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mt-12 text-left">
                                    <div className="bg-slate-800 p-8 rounded-lg border-t-8 border-yellow-500 shadow-lg">
                                        <CheckCircle className="text-yellow-500 mb-4" size={48} />
                                        <h3 className="text-3xl font-bold text-white mb-2">Licensed C-46</h3>
                                        <p className="text-slate-400 text-xl">Professional contractors (Lic# 1050566) who can quote and fix issues immediately.</p>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded-lg border-t-8 border-yellow-500 shadow-lg">
                                        <FileText className="text-yellow-500 mb-4" size={48} />
                                        <h3 className="text-3xl font-bold text-white mb-2">Detailed Reports</h3>
                                        <p className="text-slate-400 text-xl">Digital, interactive reports that make negotiation easy and transparent.</p>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded-lg border-t-8 border-yellow-500 shadow-lg">
                                        <ShieldCheck className="text-yellow-500 mb-4" size={48} />
                                        <h3 className="text-3xl font-bold text-white mb-2">Unbiased Expert</h3>
                                        <p className="text-slate-400 text-xl">We don't sell solar panels. We just make sure they work and are safe.</p>
                                    </div>
                                </div>
                                
                                <div className="mt-12 p-6 bg-slate-800/50 rounded-lg inline-block">
                                    <p className="text-2xl text-slate-300 font-mono">CA License # 1050566 • Bonded • Insured</p>
                                </div>
                            </div>
                        )
                    }
                ],
                // =========================================================================
                // *** INSPECTIONS 101 - UPGRADED FOR LARGE PROJECTION ***
                // =========================================================================
                inspections: [
                    {
                        title: "About Rocklin Solar Repair",
                        content: (
                            <div className="flex flex-col items-center justify-center">
                                <div className="mb-8">
                                    <RenderImageOrFallback imageKey="logo" alt="RSR Logo" fallback={<Sun size={120} className="text-yellow-500" />} />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-6xl text-left">
                                    <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 flex items-center">
                                        <div className="bg-yellow-500/10 p-4 rounded-full mr-6">
                                            <Calendar size={48} className="text-yellow-500" />
                                        </div>
                                        <div>
                                            <h3 className="text-3xl font-bold text-white">Established 2005</h3>
                                            <p className="text-2xl text-slate-400">20 Years of Solar Experience</p>
                                        </div>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 flex items-center">
                                        <div className="bg-yellow-500/10 p-4 rounded-full mr-6">
                                            <Award size={48} className="text-yellow-500" />
                                        </div>
                                        <div>
                                            <h3 className="text-3xl font-bold text-white">Dual Licensed</h3>
                                            <p className="text-2xl text-slate-400">CSLB #1050566 • General B & Solar C-46</p>
                                        </div>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 flex items-center">
                                        <div className="bg-yellow-500/10 p-4 rounded-full mr-6">
                                            <Wrench size={48} className="text-yellow-500" />
                                        </div>
                                        <div>
                                            <h3 className="text-3xl font-bold text-white">Proven Track Record</h3>
                                            <p className="text-2xl text-slate-400">Installed or Repaired Hundreds of Systems</p>
                                        </div>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 flex items-center">
                                        <div className="bg-yellow-500/10 p-4 rounded-full mr-6">
                                            <MapPin size={48} className="text-yellow-500" />
                                        </div>
                                        <div>
                                            <h3 className="text-3xl font-bold text-white">Local & Reliable</h3>
                                            <p className="text-2xl text-slate-400">Based in Rocklin • Serving Northern CA</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Booking",
                        content: (
                            <div className="flex flex-col items-center space-y-8">
                                <p className="text-4xl">Call, Email, or Scan to Book.</p>
                                <div className="transform scale-125 my-8">
                                    <RenderImageOrFallback 
                                        imageKey="qrCode" 
                                        alt="Booking QR Code" 
                                        fallback={
                                            <div className="bg-white p-4 rounded-lg shadow-xl">
                                                <div className="w-64 h-64 bg-slate-200 flex items-center justify-center text-slate-900 font-bold text-center text-xl p-4">
                                                    SCAN TO BOOK<br/>INSPECTION
                                                </div>
                                            </div>
                                        }
                                    />
                                </div>
                                <p className="text-yellow-500 text-6xl font-bold tracking-wider">916-741-0194</p>
                            </div>
                        )
                    },
                    {
                        title: "The Goal",
                        content: (
                            <div>
                                <RenderImageOrFallback 
                                    imageKey="slide_goal" 
                                    alt="Goal of Inspection" 
                                    fallback={null} 
                                />
                                <p className="text-4xl md:text-5xl mt-8 leading-normal">Make the transaction go smoothly. Eliminate the <span className="text-yellow-500 font-bold">"Solar Blind Spot"</span> that kills deals.</p>
                            </div>
                        )
                    },
                    {
                        title: "The Reality",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="slide_reality" alt="80% Issues" fallback={null} />
                                <p className="text-4xl md:text-5xl mt-8 leading-normal">In our experience, <span className="text-red-400 font-bold">80% of residential solar systems</span> have minor to major issues that need to be addressed.</p>
                            </div>
                        )
                    },
                    {
                        title: "Ownership",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="slide_ownership" alt="Ownership Types" fallback={null} />
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-6xl mt-8">
                                    <div className="bg-slate-800 p-8 rounded border-l-8 border-yellow-500">
                                        <h3 className="text-4xl font-bold mb-4">Purchase/Loan</h3>
                                        <p className="text-3xl text-slate-300">They own the system. The loan is debt.</p>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded border-l-8 border-yellow-500">
                                        <h3 className="text-4xl font-bold mb-4">TPO (Lease/PPA)</h3>
                                        <p className="text-3xl text-slate-300">Third Party Ownership. They rent the roof or buy the power.</p>
                                    </div>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "The Confusion",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="slide_confusion" alt="Confusion" fallback={null} />
                                <p className="text-4xl mt-8 leading-normal">The "Average Salesperson" signed them up for 25 years but didn't explain the fine print. Homeowners often don't know what they own.</p>
                            </div>
                        )
                    },
                    {
                        title: "Batteries",
                        content: (
                            <div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <RenderImageOrFallback imageKey="slide17_pic" alt="Battery Install" fallback={null} />
                                    <RenderImageOrFallback imageKey="slide17_app" alt="Battery Monitor" fallback={null} />
                                </div>
                                <div className="flex flex-col gap-6 text-left max-w-4xl mx-auto mt-8">
                                    <div className="p-6 bg-slate-800 rounded">
                                        <p className="text-3xl"><strong className="text-yellow-500">Backup:</strong> Keeps lights on when grid goes down.</p>
                                    </div>
                                    <div className="p-6 bg-slate-800 rounded">
                                        <p className="text-3xl"><strong className="text-yellow-500">Arbitrage:</strong> Stores cheap solar power to use when rates are high (4pm-9pm).</p>
                                    </div>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "3 Goals of Inspection",
                        content: (
                            <div className="w-full">
                                <RenderImageOrFallback 
                                imageKey="slide_goals" 
                                alt="3 Goals" 
                                fallback={
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full mt-4">
                                        <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 flex flex-col items-center text-center shadow-lg">
                                            <div className="bg-yellow-500/20 p-6 rounded-full mb-6">
                                                <ShieldCheck size={64} className="text-yellow-500" />
                                            </div>
                                            <h3 className="text-3xl font-bold text-white mb-4">1. Install Quality</h3>
                                            <p className="text-slate-300 text-2xl">We document condition: "How well was it installed?"</p>
                                        </div>
                                        <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 flex flex-col items-center text-center shadow-lg">
                                            <div className="bg-yellow-500/20 p-6 rounded-full mb-6">
                                                <BarChart3 size={64} className="text-yellow-500" />
                                            </div>
                                            <h3 className="text-3xl font-bold text-white mb-4">2. Performance</h3>
                                            <p className="text-slate-300 text-2xl">Lifetime production check: "Is it saving money?"</p>
                                        </div>
                                        <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 flex flex-col items-center text-center shadow-lg">
                                            <div className="bg-yellow-500/20 p-6 rounded-full mb-6">
                                                <BookOpen size={64} className="text-yellow-500" />
                                            </div>
                                            <h3 className="text-3xl font-bold text-white mb-4">3. Education</h3>
                                            <p className="text-slate-300 text-2xl">Answering the big question: "What am I actually buying?"</p>
                                        </div>
                                    </div>
                                } 
                                />
                            </div>
                        )
                    },
                    {
                        title: "What We Check",
                        content: (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                                <div className="bg-slate-800 p-6 rounded flex items-start">
                                    <CheckCircle className="text-yellow-500 mr-4 mt-2 flex-shrink-0" size={40} />
                                    <div><strong className="text-3xl block mb-2">Structural Integrity</strong><p className="text-2xl text-slate-400">Mounting looseness, roof damage, leaks.</p></div>
                                </div>
                                <div className="bg-slate-800 p-6 rounded flex items-start">
                                    <CheckCircle className="text-yellow-500 mr-4 mt-2 flex-shrink-0" size={40} />
                                    <div><strong className="text-3xl block mb-2">Wiring & Connections</strong><p className="text-2xl text-slate-400">Corrosion, fraying, loose connections.</p></div>
                                </div>
                                <div className="bg-slate-800 p-6 rounded flex items-start">
                                    <CheckCircle className="text-yellow-500 mr-4 mt-2 flex-shrink-0" size={40} />
                                    <div><strong className="text-3xl block mb-2">Shading & Soiling</strong><p className="text-2xl text-slate-400">Dirt, bird droppings, tree growth.</p></div>
                                </div>
                                <div className="bg-slate-800 p-6 rounded flex items-start">
                                    <CheckCircle className="text-yellow-500 mr-4 mt-2 flex-shrink-0" size={40} />
                                    <div><strong className="text-3xl block mb-2">Inverter Health</strong><p className="text-2xl text-slate-400">Error codes, red lights, production drop.</p></div>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Pushback - Cost",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="slide_cost" alt="Cost Benefit" fallback={null} />
                                <p className="text-5xl font-bold">"Another $299?!"</p>
                                <p className="text-slate-300 text-3xl mt-6 leading-relaxed">Here is why it pays back in spades. <br/>Avoiding one bad inverter replacement covers the cost immediately.</p>
                            </div>
                        )
                    },
                    {
                        title: "Common Objections",
                        content: (
                            <div className="space-y-6 w-full max-w-5xl">
                                <div className="p-8 bg-slate-800 rounded text-3xl md:text-4xl">"It's a new home, surely it's fine."</div>
                                <div className="p-8 bg-slate-800 rounded text-3xl md:text-4xl">"I have negative bills, it must be working."</div>
                                <div className="p-8 bg-slate-800 rounded text-3xl md:text-4xl">"It's a leased system, the company covers it."</div>
                            </div>
                        )
                    },
                    {
                        title: "Myths vs Reality",
                        content: (
                            <div className="grid grid-cols-1 gap-6 text-left w-full">
                                <div className="bg-slate-800 p-6 rounded flex flex-col md:flex-row items-center gap-6 border border-slate-700">
                                    <div className="w-full md:w-64 flex-shrink-0">
                                        {projectImages.slide_myth1 && (
                                            <img src={projectImages.slide_myth1} alt="New Home" className="w-full h-48 object-cover rounded border border-slate-600" />
                                        )}
                                    </div>
                                    <div>
                                        <strong className="text-yellow-500 text-3xl block mb-2">Myth 1: "It's a New Home"</strong>
                                        <p className="text-slate-400 italic mb-4 text-2xl">"Surely it was inspected and works fine."</p>
                                        <p className="text-slate-100 text-2xl"><strong className="text-red-400">Reality:</strong> Builders use lowest bidders. Unconnected strings and broken tiles are common.</p>
                                    </div>
                                </div>
                                <div className="bg-slate-800 p-6 rounded flex flex-col md:flex-row items-center gap-6 border border-slate-700">

                    {
                        title: "Performance Guarantees",
                        content: (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full items-start">
                                <div>
                                    <h3 className="text-xl font-bold text-green-400 mb-2">The Good</h3>
                                    <RenderImageOrFallback imageKey="tpo_guarantee_table" alt="Guarantee Table" fallback={<div className="bg-white text-black p-4 h-48 flex items-center justify-center">Table showing kWh guaranteed per year</div>} />
                                    <p className="text-sm text-slate-400 mt-2">Clear table showing minimum kWh production per year.</p>
                                </div>
                                <div>
                                    <h3 className="text-xl font-bold text-red-400 mb-2">The Bad</h3>
                                    <RenderImageOrFallback imageKey="tpo_no_guarantee" alt="No Guarantee Email" fallback={<div className="bg-white text-black p-4 h-48 flex items-center justify-center">Email: "We do not provide reimbursements."</div>} />
                                    <p className="text-sm text-slate-400 mt-2">"Per your contract, we do not guarantee any refund or compensation."</p>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Transfer Process",
                        content: (
                            <div className="flex flex-col space-y-4 w-full max-w-2xl">
                                {['Notify Provider', 'Credit Check for Buyer', 'Review Agreement', 'Clear Title (UCC-1)', 'Close Escrow'].map((step, idx) => (
                                    <div key={idx} className="flex items-center bg-slate-800 p-4 rounded border border-slate-700">
                                        <div className="bg-yellow-500 text-slate-900 w-10 h-10 rounded-full flex items-center justify-center font-bold mr-4 text-xl">
                                            {idx + 1}
                                        </div>
                                        <span className="text-xl">{step}</span>
                                    </div>
                                ))}
                            </div>
                        )
                    },
                    {
                        title: "The Gold Rush Era",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="slide_wildwest" alt="Gold Miner" fallback={null} />
                                <div className="max-w-3xl mx-auto mt-6">
                                    <p className="text-xl mb-4">The solar industry exploded like a Gold Rush. Volume was prioritized over quality.</p>
                                    <p className="text-slate-400">Result: "Solar Bros" used the lowest bidder for installs. TPO companies often own systems with exposed wires, missing clamps, and leaks.</p>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "The City Inspector Myth",
                        content: (
                            <div className="bg-slate-800 p-8 rounded-xl border-l-8 border-red-500 max-w-4xl">
                                <h3 className="text-3xl font-bold mb-4">"But it passed final inspection!"</h3>
                                <p className="text-xl leading-relaxed">
                                    City inspectors check for <span className="text-yellow-500 font-bold">safety code compliance</span> from the ground. 
                                    They rarely get on the roof to check for loose wires, broken tiles, or future leaks.
                                </p>
                                <p className="mt-6 text-slate-400 text-lg">A "Finaled Permit" does NOT guarantee a quality installation.</p>
                            </div>
                        )
                    },
                    {
                        title: "Maintenance is Required",
                        content: (
                            <div>
                                <RenderImageOrFallback imageKey="slide_service" alt="Cleaning" fallback={null} />
                                <div className="mt-6 max-w-2xl mx-auto">
                                    <h3 className="text-2xl font-bold text-yellow-500 mb-2">Annual Cleaning & Checkup</h3>
                                    <p className="text-lg">TPO contracts usually state the <strong>homeowner</strong> is responsible for keeping the panels clean to maintain the production guarantee.</p>
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Let's Work Together",
                        content: (
                            <div className="text-center flex flex-col items-center">
                                <div className="w-full max-w-sm mb-4">
                                    <RenderImageOrFallback imageKey="slide19_logo" alt="RSR Logo" fallback={<Sun size={80} className="text-yellow-500 mx-auto" />} />
                                </div>
                                <p className="text-3xl font-bold text-white mb-6">Rocklin Solar Repair</p>
                                <div className="inline-block bg-yellow-500 text-slate-900 px-8 py-4 rounded-lg text-3xl font-bold shadow-lg mb-8 hover:scale-105 transition-transform">916-741-0194</div>
                                <div className="w-full max-w-xs"><RenderImageOrFallback imageKey="qrCode" alt="Scan to Contact" fallback={null} /><p className="text-slate-400 font-bold">Scan QR to save contact</p></div>
                            </div>
                        )
                    }
                ],

                // --- SELLERS & CHECKLIST (PLACEHOLDERS) ---
                sellers: [
                    {
                        title: "For Sellers",
                        content: (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-4">Seller Resources</h3>
                                <p className="text-slate-400">Content coming soon...</p>
                            </div>
                        )
                    }
                ],
                checklist: [
                    {
                        title: "Agent Checklist",
                        content: (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-4">Agent Checklist</h3>
                                <p className="text-slate-400">Content coming soon...</p>
                            </div>
                        )
                    }
                ]
            };

            const SlideView = ({ data, index, total }) => (
                <div className="flex flex-col h-full bg-slate-900 text-slate-100 animate-fadeIn">
                    <div className="p-8 pb-0 flex justify-between items-start">
                        <div>
                            <h2 className="text-5xl md:text-7xl font-bold text-yellow-500 mb-2 tracking-tight">{data.title}</h2>
                            {data.subtitle && <h3 className="text-3xl text-slate-400">{data.subtitle}</h3>}
                        </div>
                        <div className="text-slate-600 text-2xl font-mono">
                            {index + 1} / {total}
                        </div>
                    </div>
                    
                    <div className="flex-grow flex flex-col items-center justify-center p-8 text-center overflow-y-auto min-h-0">
                        <div className="w-full max-w-7xl">
                            {data.content}
                        </div>
                    </div>

                    <div className="p-6 bg-slate-800 flex justify-between items-center border-t border-slate-700">
                        <button 
                            onClick={prevSlide} 
                            disabled={index === 0}
                            className="flex items-center px-8 py-4 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 rounded-lg text-2xl font-bold transition"
                        >
                            <ChevronLeft className="mr-2" size={32} /> Previous
                        </button>
                        <div className="text-slate-400 text-lg uppercase tracking-widest hidden md:block">
                            Rocklin Solar Repair • Presentation Mode • v{APP_VERSION}
                        </div>
                        <button 
                            onClick={nextSlide} 
                            disabled={index === total - 1}
                            className="flex items-center px-8 py-4 bg-yellow-500 hover:bg-yellow-400 text-slate-900 rounded-lg text-2xl font-bold transition"
                        >
                            Next <ChevronRight className="ml-2" size={32} />
                        </button>
                    </div>
                </div>
            );

            const WebModeView = ({ data }) => (
                <div className="container mx-auto px-4 py-12 max-w-4xl">
                    {data.map((item, idx) => (
                        <div key={idx} className="mb-16 bg-slate-800 rounded-xl p-8 border border-slate-700 shadow-xl">
                            <div className="mb-6 border-b border-slate-700 pb-4">
                                <h2 className="text-3xl font-bold text-yellow-500">{item.title}</h2>
                                {item.subtitle && <p className="text-xl text-slate-400 mt-1">{item.subtitle}</p>}
                            </div>
                            <div className="text-slate-200 text-lg leading-relaxed">
                                {item.content}
                            </div>
                        </div>
                    ))}
                    <footer className="text-center py-8 text-slate-500 border-t border-slate-800 mt-8 space-y-2">
                        <p>&copy; {new Date().getFullYear()} Rocklin Solar Repair. All Rights Reserved.</p>
                        <p className="text-sm">CA License # 1050566 • Bonded • Insured • v{APP_VERSION}</p>
                    </footer>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 font-sans selection:bg-yellow-500 selection:text-slate-900">
                    {!isPresenting && (
                        <header className="bg-slate-900 border-b border-slate-700 sticky top-0 z-50">
                            <div className="container mx-auto px-4 h-16 flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                    <Sun className="text-yellow-500 fill-yellow-500/20" />
                                    <div className="flex flex-col">
                                        <span className="font-bold text-lg leading-none text-slate-100 hidden sm:block">Rocklin Solar Repair</span>
                                        <span className="text-xs text-yellow-500 hidden sm:block font-bold">Lic# 1050566</span>
                                    </div>
                                    <span className="font-bold text-lg md:text-xl text-slate-100 sm:hidden">RSR</span>
                                </div>

                                <nav className="hidden md:flex space-x-6 text-sm font-medium text-slate-300">
                                    <button onClick={() => handleTabChange('home')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'home' ? 'text-yellow-500' : ''}`}>Home</button>
                                    <button onClick={() => handleTabChange('inspections')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'inspections' ? 'text-yellow-500' : ''}`}>Inspections 101</button>
                                    <button onClick={() => handleTabChange('tpo')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'tpo' ? 'text-yellow-500' : ''}`}>TPO & Leases</button>
                                    <button onClick={() => handleTabChange('sellers')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'sellers' ? 'text-yellow-500' : ''}`}>For Sellers</button>
                                    <button onClick={() => handleTabChange('checklist')} className={`hover:text-yellow-500 transition-colors ${activeTab === 'checklist' ? 'text-yellow-500' : ''}`}>Agent Checklist</button>
                                </nav>

                                <div className="flex items-center space-x-4">
                                    <a href="tel:9167410194" className="hidden lg:flex items-center text-yellow-500 font-bold bg-yellow-500/10 px-3 py-1 rounded-full hover:bg-yellow-500 hover:text-slate-900 transition-all">
                                        <Phone size={16} className="mr-2" /> 916-741-0194
                                    </a>
                                    <button 
                                        onClick={togglePresentation} 
                                        className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-md text-sm font-bold transition-colors border border-slate-600"
                                    >
                                        {isPresenting ? "Exit Mode" : "Presentation Mode"}
                                    </button>
                                    <button className="md:hidden text-slate-300" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                        {isMobileMenuOpen ? <X /> : <Menu />}
                                    </button>
                                </div>
                            </div>

                            {isMobileMenuOpen && (
                                <div className="md:hidden bg-slate-800 border-t border-slate-700 p-4 space-y-4">
                                    <button onClick={() => handleTabChange('home')} className="block w-full text-left text-slate-300">Home</button>
                                    <button onClick={() => handleTabChange('inspections')} className="block w-full text-left text-slate-300">Inspections 101</button>
                                    <button onClick={() => handleTabChange('tpo')} className="block w-full text-left text-slate-300">TPO & Leases</button>
                                    <button onClick={() => handleTabChange('sellers')} className="block w-full text-left text-slate-300">For Sellers</button>
                                    <button onClick={() => handleTabChange('checklist')} className="block w-full text-left text-slate-300">Agent Checklist</button>
                                    <div className="pt-4 border-t border-slate-700 text-yellow-500 font-bold text-center">916-741-0194</div>
                                </div>
                            )}
                        </header>
                    )}

                    {isPresenting ? (
                        <div className="h-screen w-full fixed inset-0 z-50 bg-slate-900">
                            <button 
                                onClick={togglePresentation}
                                className="absolute top-4 right-4 z-50 p-2 bg-slate-800/50 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition"
                            >
                                <X size={24} />
                            </button>
                            <SlideView 
                                data={contentData[activeTab][currentSlide]} 
                                index={currentSlide} 
                                total={contentData[activeTab].length} 
                            />
                        </div>
                    ) : (
                        <WebModeView data={contentData[activeTab]} />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
